services:
    backend-server1:
        build: .
        restart: unless-stopped
        depends_on:
            database:
              condition: service_healthy
            redis:
              condition: service_healthy
        healthcheck:
          test: ["CMD-SHELL","curl -f http://localhost:8000/api/health || exit 1"]
          interval: 5s
          timeout: 5s
          retries: 20
          start_period: 10s
    
    backend-server2:
        build: .
        restart: unless-stopped
        depends_on:
            database:
              condition: service_healthy
            redis:
              condition: service_healthy
        healthcheck:
          test: ["CMD-SHELL","curl -f http://localhost:8000/api/health || exit 1"]
          interval: 5s
          timeout: 5s
          retries: 20
          start_period: 10s

    backend-server3:
        build: .
        restart: unless-stopped
        depends_on:
            database:
              condition: service_healthy
            redis:
              condition: service_healthy
        healthcheck:
          test: ["CMD-SHELL","curl -f http://localhost:8000/api/health || exit 1"]
          interval: 5s
          timeout: 5s
          retries: 20
          start_period: 10s

    database:
        image: mysql:latest
        restart: unless-stopped
        ports:
          - "3306:3306"
        environment: 
           MYSQL_ROOT_PASSWORD : ${DB_PASSWORD}
           MYSQL_DATABASE : ${DB_DATABASE}
        healthcheck:
           test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
           interval: 5s
           timeout: 5s
           retries: 10
           start_period: 420s
        volumes:
          - mysql_data:/var/lib/mysql

    nginx:
      image: nginx:latest
      ports:
        - "443:443"
        - "80:80"
      restart: unless-stopped
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
        - ./certificate_key.key:/etc/nginx/certificates/certificate_key.key:ro
        - ./certificate.crt:/etc/nginx/certificates/certificate.crt:ro
      depends_on:
        backend-server1:
          condition: service_healthy
        backend-server2:
          condition: service_healthy
        backend-server3:
          condition: service_healthy

    redis:
      image: redis:latest
      volumes:
        - redis_data:/data
      ports:
        - "6379:6379"
      restart: unless-stopped
      healthcheck:
        test: ["CMD","redis-cli","ping"]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 40s

      

volumes:
  mysql_data:
  redis_data:

        